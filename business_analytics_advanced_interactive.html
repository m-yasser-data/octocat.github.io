<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحليلات الأعمال | البنك المتقدم 150 سؤال - أحمر × أزرق</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#e11d2e;--red2:#ff4d5e;--blue:#1a56db;--blue2:#5b9bff;--black:#0b0d12;--white:#ffffff;--card:#ffffff;--ink:#111827;--muted:#5b6472;--bg:#0b0d12;--green:#16a34a}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#05070c,#0b0d12 45%,#0a1a3a);color:#fff;min-height:100vh}
header{position:sticky;top:0;z-index:50;background:#05070c;border-bottom:3px solid var(--red)}
.topbar{height:6px;background:linear-gradient(90deg,var(--red) 0 33%,#fff 33% 66%,var(--blue) 66% 100%)}
.hwrap{max-width:1100px;margin:auto;padding:14px 16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--red),#7a0e18);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#fff;border:2px solid #fff;box-shadow:0 4px 20px rgba(225,29,46,.5)}
.brand h1{font-size:20px;color:#fff}.brand h1 span{color:var(--red2)}
.brand p{font-size:13px;color:#c7d2e8}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{background:#141b2e;border:1px solid #2b3a5e;padding:6px 12px;border-radius:999px;font-size:13px;color:#fff}
.badge b{color:var(--blue2)}.badge.r b{color:var(--red2)}
.controls{max-width:1100px;margin:16px auto;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:800;transition:.2s}
.btn-red{background:linear-gradient(135deg,var(--red),#8f1220);color:#fff}
.btn-red:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(225,29,46,.5)}
.btn-blue{background:linear-gradient(135deg,var(--blue),#0b2f7a);color:#fff}
.btn-ghost{background:#fff;color:#111;border:2px solid var(--blue)}
.btn-ghost.active{background:var(--blue);color:#fff}
.btn-ghost2{background:#141b2e;color:#fff;border:1px solid #3a4c78}
.btn-green{background:#16a34a;color:#fff}
.btn-small{padding:7px 12px;font-size:13px}
input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--blue);background:#fff;color:#111;font-size:15px}
.modes{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:2px solid var(--black);padding:10px;border-radius:12px;color:#111}
.modes label{display:flex;align-items:center;gap:6px;background:#0b0d12;color:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.modes input{accent-color:var(--red)}
.progress{background:#fff;border-radius:999px;height:14px;overflow:hidden;border:2px solid var(--blue)}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--blue));transition:.3s}
#info{max-width:1100px;margin:8px auto;padding:0 16px;color:#c7d2e8;font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
#score{color:#fff;font-weight:800;background:var(--red);padding:2px 12px;border-radius:999px}
main{max-width:1100px;margin:10px auto 60px;padding:0 16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);color:var(--ink);border:2px solid var(--black);border-right:8px solid var(--red);border-radius:16px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.card.revealed{border-right-color:var(--blue);outline:2px solid var(--blue)}
.card.blue{border-right-color:var(--blue)}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qnum{background:var(--black);color:#fff;font-weight:900;min-width:42px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;padding:0 8px;border:1px solid var(--red)}
.qtype{font-size:12px;background:var(--blue);color:#fff;padding:4px 10px;border-radius:999px;white-space:nowrap}
.qtype.red{background:var(--red)}
.qtext{font-size:16px;line-height:1.9;font-weight:700;margin:10px 0;color:#111}
.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.opt{background:#f1f5ff;border:2px solid #c4d3f5;border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px;line-height:1.8;color:#111;transition:.15s}
.opt:hover{border-color:var(--blue)}
.opt.selected{border-color:var(--blue);background:#dbe7ff}
.opt.correct{border-color:var(--green);background:#dcfce7;font-weight:800}
.opt.wrong{border-color:var(--red);background:#ffe1e4}
.ans{display:none;margin-top:12px;background:#0b0d12;border:2px dashed var(--red);border-radius:12px;padding:12px;font-size:14px;line-height:1.9;color:#fff}
.card.revealed .ans{display:block}
.ans .a{color:#4ade80;font-weight:800}
.ans .why{color:#e5edff;margin-top:6px}.ans .why b{color:var(--blue2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.result-tag{font-weight:900;padding:6px 12px;border-radius:999px;font-size:13px;display:none}
.result-tag.ok{display:inline-block;background:#dcfce7;color:#166534;border:2px solid #16a34a}
.result-tag.no{display:inline-block;background:#ffe1e4;color:#991b1b;border:2px solid var(--red)}
.sec-title{margin:18px 0 2px;font-size:18px;color:#fff;border-right:6px solid var(--red);padding-right:10px;background:linear-gradient(90deg,rgba(225,29,46,.25),transparent);padding-top:6px;padding-bottom:6px;border-radius:6px}
.sec-title.blue{border-right-color:var(--blue);background:linear-gradient(90deg,rgba(26,86,219,.3),transparent)}
footer{text-align:center;color:#9fb0c9;padding:24px;font-size:13px}
@media(max-width:600px){.qtext{font-size:15px}.brand h1{font-size:17px}}
@media print{header,.controls,#info,.actions{display:none}body{background:#fff}.card{background:#fff;color:#000}.ans{display:block!important;color:#000;border:1px solid #000}}
</style>
</head>
<body>
<div class="topbar"></div>
<header><div class="hwrap">
<div class="brand"><div class="logo">A</div><div><h1>تحليلات الأعمال <span>| البنك المتقدم 150 سؤال</span></h1><p>60 اختيار + 30 صح/خطأ + 30 مقالي + 30 قصير | الأسئلة بالفصحى والشرح بالعامية | اضغط لكشف الإجابة</p></div></div>
<div class="stats">
<span class="badge r">الإجمالي <b>150</b></span>
<span class="badge">اختيار <b>60</b></span>
<span class="badge">صح/خطأ <b>30</b></span>
<span class="badge r">مقالي <b>30</b></span>
<span class="badge">قصير <b>30</b></span>
</div></div></header>
<div class="controls">
<input type="text" id="search" placeholder="🔍 ابحث... مثال: بورتر / SWOT / DMAIC / BSC">
<div class="row" id="filters">
<button class="btn-ghost active btn-small" data-f="all">الكل (150)</button>
<button class="btn-ghost btn-small" data-f="mcq">اختيار (60)</button>
<button class="btn-ghost btn-small" data-f="tf">صح/خطأ (30)</button>
<button class="btn-ghost btn-small" data-f="essay">مقالي (30)</button>
<button class="btn-ghost btn-small" data-f="short">قصير (30)</button>
</div>
<div class="modes">
<label><input type="radio" name="mode" value="study" checked> 📖 مذاكرة (كشف الإجابات)</label>
<label><input type="radio" name="mode" value="exam"> 📝 اختبار (اختر ثم تحقق + نتيجة)</label>
</div>
<div class="row">
<button class="btn-red btn-small" onclick="showAll()">👁 إظهار الكل</button>
<button class="btn-ghost2 btn-small" onclick="hideAll()">🙈 إخفاء الكل</button>
<button class="btn-blue btn-small" onclick="shuffle()">🔀 عشوائي</button>
<button class="btn-ghost2 btn-small" onclick="resetExam()">↺ تصفير النتيجة</button>
<button class="btn-ghost2 btn-small" onclick="window.print()">🖨 طباعة</button>
</div>
<div class="progress"><div id="bar"></div></div>
</div>
<div id="info"><span id="count"></span><span id="score">النتيجة: 0 / 0 (0%)</span></div>
<main id="list"></main>
<footer>ملف واحد يعمل بدون إنترنت — أحمر × أبيض × أسود × أزرق | نفس آلية التفاعل: زر + نقر</footer>
<script>

{t:"mcq",s:"القسم الأول: اختيار من متعدد (60)",q:"أي عنصر في MOST يعبر عن الإجراءات المحددة لتحقيق الاستراتيجية؟",o:["التكتيكات","المهمة","الرؤية","القيود القانونية"],a:0,w:"التكتيك مستوى التنفيذ العملي: هنعمل إيه وإمتى وإزاي."},

{t:"mcq",s:"القسم الأول: اختيار من متعدد (60)",q:"في سوق السيارات الفارهة، أي تفسير ينسجم أكثر مع قوة المشترين؟",o:["يميل نفوذ المشترين للانخفاض إذا البدائل محدودة","تكون قوة المشترين مرتفعة جدا دائما","لا علاقة لقوة المشترين بنوع السوق","ترتفع فقط بزيادة جودة المنتج"],a:0,w:"قلة البدائل وتمايز المنتج تقلل قدرة المشتري على الضغط على السعر."},

{t:"mcq",s:"القسم الأول: اختيار من متعدد (60)",q:"صاغ المحلل سيناريو شراء ولم يذكر نفاد المخزون. المشكلة؟",o:["يفتقد مسارا استثنائيا مهما","أصبح أطول من اللازم","تحول لـ PESTLE","لا توجد مشكلة"],a:0,w:"نفاد المخزون حالة بديلة مؤثرة والتغطية ناقصة."},

{t:"mcq",s:"القسم الأول: اختيار من متعدد (60)",q:"ما الهدف من BRD؟",o:["توثيق متطلبات وقيود العمل الملزمة للحل","تحديد لون العلامة فقط","استبدال الاختبارات","قياس التضخم"],a:0,w:"تجمع احتياجات العمل والقيود وتوضح المطلوب من الحل."},
{t:"mcq",s:"القسم الأول: اختيار من متعدد (60)",q:"أي نشاط يعبر عن دور المحلل كميسّر؟",o:["قيادة حوار للتوفيق بين التقنية والإدارية","برمجة النظام","تحديد الأسعار","تصميم الشبكة"],a:0,w:"يساعد الأطراف تتفاهم وتوصل لاتفاق بدل الصراع."},

{t:"tf",s:"القسم الثاني: صح/خطأ (30)",q:"الأسئلة المفتوحة ينبغي تجنبها دائما في المقابلات.",a:0,fix:"المفتوحة مهمة في الاستنباط ثم الاستيضاحية لتدقيق التفاصيل.",w:"المفتوحة تكشف التفاصيل ثم ندقق."},
{t:"tf",s:"القسم الثاني: صح/خطأ (30)",q:"يمكن أن تتضمن BRD قيودا تنظيمية وقانونية ملزمة للمشروع.",a:1,w:"تحدد حدود الحل ولازم تكون واضحة."},

{t:"tf",s:"القسم الثاني: صح/خطأ (30)",q:"حذف خطوة غير ضرورية لتقليل الزمن يُعد تبسيطا لا أتمتة.",a:1,w:"شلت خطوة لا أضفت تقنية تنفذها تلقائيا."},
{t:"tf",s:"القسم الثاني: صح/خطأ (30)",q:"BSC تساعد في تحويل الاستراتيجية لأهداف تشغيلية ومقاييس.",a:1,w:"الربط بين الاستراتيجية والتنفيذ."},
{t:"tf",s:"القسم الثاني: صح/خطأ (30)",q:"الرؤية المستقبلية تصف الحالة التي تطمح المنظمة لتحقيقها بعيد المدى.",a:1,w:"صورة مستقبلية واسعة لا خطوة يومية."},
{t:"tf",s:"القسم الثاني: صح/خطأ (30)",q:"استخدام DMADV أكثر اتساقا عندما لا توجد عملية مناسبة ونحتاج تصميما جديدا.",a:1,w:"تصميم جديد بدل تحسين الموجود."},
{t:"tf",s:"القسم الثاني: صح/خطأ (30)",q:"الاستماع الفعال يعني السكوت فقط دون أسئلة أو تحقق.",a:0,fix:"يشمل الفهم والتوضيح والتحقق من صحة الفهم.",w:"تأكد أن الرسالة اتفهمت صح."},
{t:"tf",s:"القسم الثاني: صح/خطأ (30)",q:"تحديد مصدر المتطلب يساعد على معرفة من أين جاء والرجوع عند الحاجة.",a:1,w:"قيمة أساسية في تتبع المتطلبات."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"ناقش المراحل العامة للتعامل مع التغيير مع توضيح دور التدريب.",a:"فهم الحاجة للتغيير ثم الانتقال للوضع المستهدف ثم دعم الحالة الجديدة وتثبيتها. التدريب على الأنظمة المستحدثة من أنشطة دعم الانتقال.",w:"الناس تعرف ليه بنتغير وهنروح لفين. التدريب يقلل الارتباك ويثبت التغيير."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"اشرح عناصر MOST الأربعة ووضّح الفرق بين الاستراتيجية والتكتيك بمثال.",a:"Mission الغرض، Objectives النتائج، Strategy الاتجاه العام، Tactics الإجراءات المحددة. مثال: التوسع في سوق جديد استراتيجية، وحملة رقمية بمواعيد تكتيك.",w:"من الصورة الكبيرة للتنفيذية: ليه موجودين وعايزين إيه وهنمشي فين وهنعمل إيه."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"قارن بين SWOT وMOST من حيث الوظيفة والعلاقة.",a:"SWOT يجمع القوة والضعف والفرص والتهديدات، وMOST ينظم الغرض والأهداف والاستراتيجية والتكتيكات. نتائج SWOT أساس لصياغة MOST.",w:"SWOT يقول واقفين فين، وMOST يحول الصورة لاتجاه وخطة."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"اشرح PESTLE مع بيان تصنيف الاجتماعي والاقتصادي والقانوني والتكنولوجي.",a:"إطار فحص الخارجية: اجتماعي سلوك المجتمع، اقتصادي التمويل والأسعار، قانوني القوانين واللوائح، تكنولوجي التقنيات المغيرة للمنتجات.",w:"نبص بره الشركة ونشوف المجتمع والاقتصاد والقانون والتكنولوجيا."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"حلل حالة اعتماد مصنع على عميل واحد 70% بمنطق بورتر.",a:"ارتفاع الاعتماد يزيد أهمية المشتري وقد يرفع قوته التفاوضية خاصة مع بدائل أو قدرة تغيير المورد.",w:"70% رقم كبير فالمصنع معتمد والعميل يضغط في السعر."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"فسر لماذا قد تكون قوة المشترين أقل في الفارهة مقارنة بسوق متجانس.",a:"المنتج متمايز والبدائل محدودة وحساسية السعر أقل فتقل قدرة فرض الشروط.",w:"مميز وبدائل قليلة فصعب يقول هروح لمنافس بنفس القيمة."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"اشرح الفرق بين DMAIC وDMADV من حيث طبيعة المشكلة.",a:"DMAIC لتحسين عملية قائمة، وDMADV لتصميم حل جديد عند غياب عملية مناسبة. التمييز تحسين مقابل تصميم جديد.",w:"موجودة وعايز تصلحها؟ DMAIC. مفيش وعايز تبني؟ DMADV."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"اشرح كيف يمكن استخدام كايزن دون تغيير جذري شامل.",a:"تحسينات مستمرة متدرجة: تقليل خطوة، تقليل زمن، تحسين ترتيب، ثم متابعة واستمرار.",w:"خطوة ورا خطوة مع قياس النتيجة ثم تكمل."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"ناقش استخدام إيشيكاوا في تحليل ارتفاع الأخطاء.",a:"تحديد المشكلة بوضوح ثم تنظيم الأسباب في فئات ثم مراجعتها للوصول للجذرية المستحقة للمعالجة.",w:"بدل «الموظف غلط» نفكك: إجراء؟ تدريب؟ مدخلات؟ نظام؟"},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"وضح لماذا لا يُنصح بأتمتة عملية معقدة قبل تبسيطها.",a:"الأتمتة قد تنقل التعقيد لنظام آلي دون إزالة الأصل. نفهم ونحدد ذات القيمة ثم نبسط ثم نقيم مواضع الأتمتة.",w:"أتمتة معقدة = تعقيد سريع. بسّط أولا ثم أتمت ما يستاهل."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"اشرح دور BSC في ترجمة الاستراتيجية لمستوى تشغيلي.",a:"تحول الاستراتيجية لأهداف ومقاييس: هدف تحسين الخدمة لمؤشر زمن معالجة أو عمليات داخلية.",w:"بدل «نحسن الخدمة» نحط حاجة تتقاس: الزمن والأخطاء."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"ناقش تصنيف أصحاب المصلحة وفق القوة والتأثير مع حالتين.",a:"مرتفع/مرتفع إدارة عن قرب، ومنخفض القوة مرتفع التأثير إبقاؤهم مطلعين.",w:"صاحب القرار القوي مشاركة قريبة، والمتأثر بلا سلطة تواصل مستمر."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"اشرح أهمية الأسئلة المفتوحة في المقابلات.",a:"تسمح بشرح العملية والمشكلة والاستثناءات بحرية ثم أسئلة استيضاحية/مغلقة للتحديد والتحقق.",w:"تفتح الكلام وتطلع غير المتوقع ثم نضيق بالتفاصيل."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"ناقش أهمية الاستماع الفعال للمحلل.",a:"فهم المقصود واكتشاف القيود والاستثناءات وطرح توضيحية وإعادة صياغة للتحقق.",w:"مش مسجل صوت: افهم واسأل وراجع «فهمت كذا صح؟»."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"اشرح كيف تساعد BRD في تقليل سوء الفهم.",a:"مرجع منظم للمتطلبات وقيود العمل ومنها القانونية لصياغة مشتركة لما يجب أن يحققه الحل.",w:"المكتوب يقلل أن كل طرف يفهم حاجة مختلفة."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"ناقش أهمية تضمين البديلة والاستثنائية في سيناريو شراء.",a:"الأساسي لا يغطي الواقع. يجب حالات نفاد المخزون أو فشل خطوة لاكتمال التحليل والحل.",w:"الحقيقية مش على الخط المثالي. نفاد المخزون لازم يتحسب."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"اشرح كيف يؤدي المحلل دور الميسّر بين الإدارة والتقني.",a:"ينظم الحوار ويوضح المختلف عليه ويطلب أدلة عند الغموض ويبحث عن صياغة مشتركة دون انحياز.",w:"يسهل الفهم لا يأخذ صف طرف. يظبط الحوار للاتفاق."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"ناقش أهمية المعرفة ببيئة IT للمحلل.",a:"فهم القيود التقنية واللغة وأسئلة واقعية عن قابلية التنفيذ وتواصل أفضل مع التقنيين.",w:"مش لازم مبرمج لكن يفهم بما يكفي لطلب واقعي."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"اشرح مفهوم البديل في بورتر مع مثال التعليم الذاتي.",a:"حل مختلف يؤدي وظيفة مشابهة من وجهة العميل. التعليم الذاتي بديل جزئي لوظائف الجامعات.",w:"المهم يشبع نفس الاحتياج بطريقة مختلفة."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"ناقش كيف يصبح التضخم تهديدا لشركة عقارية.",a:"عامل خارجي يرفع تكاليف البناء والتمويل ويؤثر في القدرة الشرائية والطلب فيُصنف تهديدا في SWOT.",w:"من بره الشركة ولو ضغط على التكلفة والطلب يبقى تهديد."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"اشرح المنطق العام لاستراتيجية ST مع مثال.",a:"استغلال القوة الداخلية لمواجهة التهديدات: قاعدة عملاء قوية أو خبرة لمواجهة بديل أو ضغط تنافسي.",w:"حاجة قوية من جوه كدرع ضد مشكلة من بره."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"ناقش الفرق بين تبسيط العملية وإعادة تصميمها.",a:"التبسيط إزالة غير الضروري وتقليل التعقيد، وإعادة التصميم ترتيب/بناء التدفق من البداية لتغيير طريقة العمل.",w:"التبسيط شيل خطوة، وإعادة التصميم بناء طريقة السير نفسها."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"اشرح كيف يساعد تحديد أصل المتطلب.",a:"يوضح الجهة/الوثيقة ويسمح بالرجوع للتحقق من المبرر أو تحديث المعلومات عند تعارض/تغيير.",w:"نرجع للأصل لو حصل خلاف أو تغيرت المعلومة."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"ناقش العلاقة بين الوصفي واكتشاف ساعات الذروة من بيانات الماضي.",a:"الوصفي يلخص ما حدث تاريخيا، واكتشاف ذروة العام الماضي مثال مباشر لوصف الأنماط السابقة.",w:"نبص للماضي ونفهم حصل إيه مش نقول يعمل إيه مستقبلا."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"اشرح لماذا الرؤية مختلفة عن التكتيك.",a:"الرؤية حالة مستقبلية بعيدة التكتيك إجراء تنفيذي محدد لتحقيق الاستراتيجية والأهداف.",w:"الرؤية «عايزين نبقى إيه؟» والتكتيك «هنعمل إيه دلوقتي؟»."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"ناقش دور التفاوض في حل تعارض المتطلبات.",a:"كشف المصالح والقيود وتحديد الاتفاق والاختلاف وموازنة الأولويات لصياغة مقبولة.",w:"نفهم كل طرف ونطلع بحل يحقق أكبر قيمة دون تجاهل القيود."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"اشرح كيف تكشف أسئلة المقابلة قيود النظام البرمجية.",a:"أسئلة حول الأداء والتكامل والصلاحيات والبيانات والحالات العاجزة ثم توثيق وتحليل الأثر.",w:"بيقدر إيه ومابيقدرش إيه لمتطلب واقعي."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"ناقش استخدام MOST وSWOT وBSC في تسلسل واحد.",a:"SWOT يفهم الداخلي والخارجي ثم MOST يصيغ المهمة والأهداف والاستراتيجية والتكتيكات ثم BSC لمؤشرات قابلة للمتابعة.",w:"SWOT يفهم الواقع وMOST يحوله لاتجاه وBSC يقيس التنفيذ."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"اشرح لماذا إغفال الاستثنائية خطر على جودة السيناريو.",a:"يركز على الطبيعي فقط ولا يوضح التعامل مع الأخطاء وغير المعتاد فيقل الاكتمال.",w:"كتابة النجاح فقط تترك المشاكل الحقيقية لتظهر وقت التشغيل."},
{t:"essay",s:"القسم الثالث: مقالي (30)",q:"ناقش موازنة المحلل بين متطلبات أصحاب المصلحة والقيود التقنية.",a:"فهم الحاجة والهدف ثم استنباط المتطلبات وتحديد القيود ثم تفاوض وتيسير لتوفيق وصياغة حل قابل للتنفيذ.",w:"لا طلب منفصل عن الواقع: نفهم الهدف ونشوف القيود ونتفاوض."},
{t:"short",s:"القسم الرابع: قصيرة (30)",q:"ما المقصود بـ Mission في MOST؟",a:"الغرض الأساسي من وجود المنظمة وما تسعى لتقديمه.",w:"الشركة موجودة ليه وبتعمل إيه أساسا."},
{t:"short",s:"القسم الرابع: قصيرة (30)",q:"ما المقصود بـ Objectives في MOST؟",a:"النتائج والأهداف المحددة التي تسعى المنظمة لتحقيقها.",w:"الحاجات اللي عايزين نوصل لها بشكل قابل للقياس."},
{t:"short",s:"القسم الرابع: قصيرة (30)",q:"ما المقصود بـ Strategy في MOST؟",a:"الاتجاه العام الذي تختاره المنظمة لتحقيق أهدافها.",w:"هنمشي في أنهي طريق للأهداف."},
{t:"short",s:"القسم الرابع: قصيرة (30)",q:"ما المقصود بـ Tactics في MOST؟",a:"الإجراءات التنفيذية المحددة الداعمة للاستراتيجية.",w:"الخطوات العملية على الأرض."},
{t:"short",s:"القسم الرابع: قصيرة (30)",q:"ما الوظيفة الأساسية لـ SWOT؟",a:"تحليل القوة والضعف والفرص والتهديدات.",w:"إيه من جوه وإيه من بره ونستخدمها في التخطيط."},
{t:"short",s:"القسم الرابع: قصيرة (30)",q:"ما المقصود بالعامل الاجتماعي في PESTLE؟",a:"المرتبط بسلوك المجتمع واتجاهات الأفراد والمستهلكين.",w:"الناس بتفكر وتتصرف إزاي."},
{t:"short",s:"القسم الرابع: قصيرة (30)",q:"ما المقصود بالعامل الاقتصادي في PESTLE؟",a:"العوامل الاقتصادية الخارجية كالتمويل والأسعار.",w:"أي حاجة اقتصادية من بره تأثر في التكلفة والطلب."},
{t:"short",s:"القسم الرابع: قصيرة (30)",q:"ما المقصود بالعامل القانوني في PESTLE؟",a:"القوانين واللوائح والالتزامات التشريعية.",w:"قواعد لازم تلتزم بها مش اختيارية."},
{t:"short",s:"القسم الرابع: قصيرة (30)",q:"ما المقصود بالعامل التكنولوجي في PESTLE؟",a:"التغيرات التقنية المؤثرة في المنتجات أو طرق العمل.",w:"أي تقنية جديدة تغير شغل الشركة."},
{t:"short",s:"القسم الرابع: قصيرة (30)",q:"ما معنى قوة المشتري في بورتر؟",a:"قدرة المشترين على التأثير في السعر أو الشروط.",w:"كلما ضغط أكثر زادت قوته التفاوضية."},
{t:"short",s:"القسم الرابع: قصيرة (30)",q:"ما المقصود بالمنتج البديل في بورتر؟",a:"حل مختلف يؤدي وظيفة مشابهة من وجهة العميل.",w:"يحل نفس المشكلة بطريقة تانية."},
{t:"short",s:"القسم الرابع: قصيرة (30)",q:"ما وظيفة مخطط إيشيكاوا؟",a:"تنظيم الأسباب المحتملة والمساعدة للوصول للجذرية.",w:"نفكك المشكلة بدل التخمين."},
{t:"short",s:"القسم الرابع: قصيرة (30)",q:"ما الفكرة الأساسية في كايزن؟",a:"التحسين المستمر والمتدرج للعمليات.",w:"تحسينات صغيرة مستمرة بدل ضخمة مرة واحدة."},

let mode="study",filter="all",query="",order=[...DATA.keys()],revealed=new Set(),examState={};
document.querySelectorAll('input[name=mode]').forEach(r=>r.addEventListener('change',e=>{mode=e.target.value;render();}));
document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render();}));
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim();render();});
function shuffle(){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}render();}
function showAll(){DATA.forEach((_,i)=>revealed.add(i));render();}
function hideAll(){revealed.clear();render();}
function resetExam(){examState={};revealed.clear();updateScore();render();}
function typeLabel(t){return t==="mcq"?"اختيار من متعدد":t==="tf"?"صح / خطأ":t==="essay"?"مقالي":"قصير";}
function filtered(){return order.filter(i=>{const d=DATA[i];if(filter!=="all"&&d.t!==filter)return false;if(query&&!(d.q+d.s+(d.o?d.o.join(" "):"")).includes(query))return false;return true;});}
function updateScore(){let ok=0,tot=0;for(const k in examState){tot++;if(examState[k].correct)ok++;}const p=tot?Math.round(ok/tot*100):0;document.getElementById('score').textContent=`النتيجة: ${ok} / ${tot} (${p}%)`;document.getElementById('bar').style.width=p+"%";}
function render(){
const list=document.getElementById('list');list.innerHTML="";
const idx=filtered();
document.getElementById('count').textContent=`عرض ${idx.length} من ${DATA.length} — اضغط لكشف الحل`;
let lastSec="";
idx.forEach((di,n)=>{
const d=DATA[di];
if(d.s!==lastSec){lastSec=d.s;const h=document.createElement('div');h.className="sec-title"+(d.t==="mcq"||d.t==="short"?" blue":"");h.textContent=d.s;list.appendChild(h);}
const card=document.createElement('div');card.className="card"+(revealed.has(di)?" revealed":"")+((di%2)?" blue":"");
const head=document.createElement('div');head.className="qhead";
head.innerHTML=`<div class="qnum">${n+1}</div><div class="qtype${(d.t==="essay"||d.t==="tf")?" red":""}">${typeLabel(d.t)}</div>`;
card.appendChild(head);
const qt=document.createElement('div');qt.className="qtext";qt.textContent=d.q;card.appendChild(qt);
if(d.t==="mcq"){
const box=document.createElement('div');box.className="opts";
const letters=["أ","ب","ج","د"];
d.o.forEach((op,oi)=>{
const o=document.createElement('div');o.className="opt";
const st=examState[di];
if(mode==="exam"&&st){if(st.checked&&oi===d.a)o.classList.add("correct");if(st.checked&&st.sel===oi&&st.sel!==d.a)o.classList.add("wrong");if(!st.checked&&st.sel===oi)o.classList.add("selected");}
else if(mode==="study"&&revealed.has(di)&&oi===d.a){o.classList.add("correct");}
o.textContent=letters[oi]+" ) "+op;
o.onclick=()=>{if(mode==="study"){revealed.has(di)?revealed.delete(di):revealed.add(di);render();}else{if(examState[di]&&examState[di].checked)return;examState[di]={sel:oi,checked:false,correct:false};render();}};
box.appendChild(o);});
card.appendChild(box);
}else if(d.t==="tf"){
const box=document.createElement('div');box.className="opts";
[["✓ صح",1],["✗ خطأ",0]].forEach(([lab,val])=>{
const o=document.createElement('div');o.className="opt";o.textContent=lab;
const st=examState[di];
if(mode==="exam"&&st){const ca=d.a?1:0;if(st.checked&&val===ca)o.classList.add("correct");if(st.checked&&st.sel===val&&st.sel!==ca)o.classList.add("wrong");if(!st.checked&&st.sel===val)o.classList.add("selected");}
else if(mode==="study"&&revealed.has(di)&&((d.a===1&&val===1)||(d.a===0&&val===0))){o.classList.add("correct");}
o.onclick=()=>{if(mode==="study"){revealed.has(di)?revealed.delete(di):revealed.add(di);render();}else{if(examState[di]&&examState[di].checked)return;examState[di]={sel:val,checked:false,correct:false};render();}};
box.appendChild(o);});
card.appendChild(box);
}
const acts=document.createElement('div');acts.className="actions";
const btn=document.createElement('button');
btn.className=revealed.has(di)?"btn-ghost2 btn-small":"btn-red btn-small";
btn.textContent=revealed.has(di)?"🙈 إخفاء":"👁 إظهار الإجابة والشرح";
btn.onclick=()=>{revealed.has(di)?revealed.delete(di):revealed.add(di);render();};
acts.appendChild(btn);
if(mode==="exam"&&(d.t==="mcq"||d.t==="tf")){
const chk=document.createElement('button');chk.className="btn-blue btn-small";chk.textContent="✔ تحقق";
chk.onclick=()=>{const st=examState[di];if(!st||st.checked){alert("اختر إجابة أولا بالضغط عليها.");return;}st.checked=true;const ca=d.t==="mcq"?d.a:(d.a?1:0);st.correct=(st.sel===ca);revealed.add(di);updateScore();render();};
acts.appendChild(chk);
const tag=document.createElement('span');tag.className="result-tag";
const st=examState[di];
if(st&&st.checked){tag.classList.add(st.correct?"ok":"no");tag.textContent=st.correct?"✔ صحيحة":"✘ خاطئة";}
acts.appendChild(tag);
}
card.appendChild(acts);
const ans=document.createElement('div');ans.className="ans";
let html="";
if(d.t==="mcq"){const letters=["أ","ب","ج","د"];html+=`<div class="a">✅ الإجابة: (${letters[d.a]}) ${d.o[d.a]}</div>`;}
else if(d.t==="tf"){html+=d.a?`<div class="a">✅ الإجابة: صحيحة ✓</div>`:`<div class="a">✅ الإجابة: خاطئة ✗</div>`;if(d.fix)html+=`<div class="why"><b>التصحيح:</b> ${d.fix}</div>`;}
else{html+=`<div class="a">✅ الإجابة النموذجية:</div><div class="why">${d.a}</div>`;}
if(d.w)html+=`<div class="why"><b>الشرح بالعامية:</b> ${d.w}</div>`;
ans.innerHTML=html;
card.appendChild(ans);
list.appendChild(card);
});
updateScore();
}
render();
</script>
</body>
</html>
